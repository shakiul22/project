<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WhatApp - Chats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="theme-light">
  <main class="mobile-shell">
    <header class="top-bar glass">
      <div class="left-group">
        <img class="avatar me" src="https://i.pravatar.cc/80?img=12" alt="My profile" />
        <div>
          <h1>Chats</h1>
          <p class="muted">Stay connected</p>
        </div>
      </div>
      <div class="icon-group">
        <button class="icon-btn" aria-label="Search" onclick="window.location.href='search.html'">🔍</button>
        <button class="icon-btn" aria-label="Notifications" onclick="window.location.href='notifications.html'">
          🔔 <span class="badge" id="notifyBadge">3</span>
        </button>
        <button class="icon-btn" aria-label="Toggle theme" id="themeToggle">🌓</button>
      </div>
    </header>

    <section class="search-wrap">
      <label class="search-pill">
        <span>🔎</span>
        <input type="text" id="chatSearch" placeholder="Search conversations" />
      </label>
    </section>

    <section class="chat-list" id="chatList"></section>

    <button class="fab" aria-label="New message">✉️</button>

    <nav class="bottom-nav glass">
      <a class="active" href="index.html">Chats</a>
      <a href="profile.html">Profile</a>
      <a href="settings.html">Settings</a>
    </nav>
  </main>

  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
